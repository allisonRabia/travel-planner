version: '1.0'

services:
  mysql:
    image: mysql:8
    container_name: travelplanner-jdbc-connector
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: travelplanner
      MYSQL_DATABASE: travelplanner
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: